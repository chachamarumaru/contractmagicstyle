<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Contract</title>


    <!-- =================================
         Webフォント
    ================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================
     ① 最初の画面
===================================== -->

<section
    id="intro"
    class="screen active"
>

    <div class="intro-text">
        さあ、契約を。
    </div>

</section>



<!-- =====================================
     ② 契約書
===================================== -->

<section
    id="contract"
    class="screen"
>

    <div
        class="paper-wrapper"
        id="paperWrapper"
    >

        <div class="paper">


            <!-- =================================
                 紙の丸まり
            ================================== -->

            <div class="paper-curl"></div>


            <!-- =================================
                 紙の質感
            ================================== -->

            <div class="paper-texture"></div>


            <!-- =================================
                 手書き文字
                 
                 元画像は1枚だけ。
                 
                 同じ画像を3枚重ねて、
                 それぞれ担当する部分だけ
                 表示する。
            ================================== -->


            <!-- 題名 -->
            <img
                src="contract-text.png"
                class="contract-text title-layer"
                alt=""
            >


            <!-- 本文 -->
            <img
                src="contract-text.png"
                class="contract-text body-layer"
                id="bodyLayer"
                alt=""
            >


            <!-- 署名 -->
            <img
                src="contract-text.png"
                class="contract-text signature-layer"
                id="signatureLayer"
                alt=""
            >


            <!-- =================================
                 署名タップ領域

                 見えない透明ボタン
            ================================== -->

            <button
                type="button"
                id="signatureLine"
                class="signature-hitarea"
                aria-label="契約に署名する"
            >
                <span class="tap-text">
                    TAP
                </span>
            </button>


            <!-- 内側の枠 -->

            <div class="paper-border"></div>

        </div>

    </div>

</section>



<!-- =====================================
     JavaScript
===================================== -->

<script>

"use strict";


/* =====================================
   状態
===================================== */

let writing = false;
let writingFinished = false;
let signing = false;


/* =====================================
   要素
===================================== */

const intro =
    document.getElementById("intro");

const contract =
    document.getElementById("contract");

const paperWrapper =
    document.getElementById("paperWrapper");

const bodyLayer =
    document.getElementById("bodyLayer");

const signatureLayer =
    document.getElementById("signatureLayer");

const signatureLine =
    document.getElementById("signatureLine");


/* =====================================
   初期状態
===================================== */

bodyLayer.classList.remove("writing");

signatureLayer.classList.remove("ready");

signatureLine.classList.remove("ready");


/* =====================================
   ①
   「さあ、契約を。」
   ↓
   ② 契約書
===================================== */

setTimeout(() => {

    intro.classList.remove("active");

    contract.classList.add("active");


    /*
     * 紙と題名が出てきたあと、
     * 少しだけ間を置いて本文開始
     */

    setTimeout(() => {

        startWriting();

    }, 1100);

}, 2200);



/* =====================================
   本文を書き始める
===================================== */

function startWriting() {

    if (writingFinished) {
        return;
    }


    writing = true;


    /*
     * 本文の手書き開始
     */

    bodyLayer.classList.add("writing");


    /*
     * 3.8秒かけて
     * 本文を書いていく
     */

    setTimeout(() => {

        finishWriting();

    }, 4000);


    /*
     * 書いている途中に画面をタップすると
     * 完成状態へスキップ
     */

    document.addEventListener(
        "click",
        handleWritingSkip
    );

}



/* =====================================
   本文完成
===================================== */

function finishWriting() {

    if (writingFinished) {
        return;
    }


    writing = false;

    writingFinished = true;


    /*
     * 本文を完全表示
     */

    bodyLayer.classList.add("writing");


    /*
     * CSSアニメーション終了後に
     * 署名を出す
     */

    setTimeout(() => {

        signatureLayer.classList.add(
            "ready"
        );


        /*
         * 署名へカメラを寄せる
         */

        setTimeout(() => {

            paperWrapper.classList.add(
                "signature-focus"
            );

            signatureLine.classList.add(
                "ready"
            );

        }, 500);

    }, 300);


    /*
     * スキップ用イベント解除
     */

    document.removeEventListener(
        "click",
        handleWritingSkip
    );

}



/* =====================================
   本文を書いている途中のタップ
===================================== */

function handleWritingSkip(event) {

    if (
        !writing ||
        writingFinished
    ) {
        return;
    }


    /*
     * 署名タップ領域は無視
     */

    if (
        event.target.closest(
            "#signatureLine"
        )
    ) {
        return;
    }


    finishWriting();

}



/* =====================================
   署名タップ
===================================== */

signatureLine.addEventListener(
    "click",
    signContract
);



/* =====================================
   契約
===================================== */

function signContract() {

    if (
        signing ||
        !writingFinished
    ) {
        return;
    }


    signing = true;


    /*
     * TAPを消す
     */

    signatureLine.classList.remove(
        "ready"
    );


    /*
     * ズーム解除
     */

    paperWrapper.classList.remove(
        "signature-focus"
    );


    /*
     * 次のフレームで消滅開始
     */

    requestAnimationFrame(() => {

        paperWrapper.classList.add(
            "bottom-disappear"
        );

    });


    /*
     * 魔法粒子
     */

    createBottomMagic();


    /*
     * =================================
     * 移動先URL
     * =================================
     */

    setTimeout(() => {

        window.location.href =
            "ここにURL";

    }, 1900);

}



/* =====================================
   下から舞い上がる魔法
===================================== */

function createBottomMagic() {

    const wrapper =
        document.getElementById(
            "paperWrapper"
        );


    for (
        let i = 0;
        i < 130;
        i++
    ) {

        const particle =
            document.createElement(
                "span"
            );


        particle.className =
            "bottom-particle";


        /*
         * 発生位置
         */

        particle.style.left =
            (
                5 +
                Math.random() * 90
            ) + "%";


        particle.style.top =
            (
                88 +
                Math.random() * 24
            ) + "%";


        /*
         * 横方向
         */

        particle.style.setProperty(
            "--x",
            (
                Math.random() * 120 -
                60
            ) + "px"
        );


        /*
         * 上方向
         */

        particle.style.setProperty(
            "--y",
            -(
                40 +
                Math.random() * 180
            ) + "px"
        );


        /*
         * サイズ
         */

        const size =
            2 +
            Math.random() * 6;


        particle.style.width =
            size + "px";

        particle.style.height =
            size + "px";


        /*
         * ランダムなタイミング
         */

        particle.style.animationDelay =
            (
                Math.random() * 0.7
            ) + "s";


        wrapper.appendChild(
            particle
        );


        setTimeout(() => {

            particle.remove();

        }, 1900);

    }

}

</script>

</body>
</html>
