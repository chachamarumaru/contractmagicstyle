<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Contract</title>


    <!-- =================================
         Webフォント
    ================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================
     ① 最初の画面
===================================== -->

<section
    id="intro"
    class="screen active"
>

    <div class="intro-text">
        さあ、契約を。
    </div>

</section>



<!-- =====================================
     ② 契約書
===================================== -->

<section
    id="contract"
    class="screen"
>

    <div
        class="paper-wrapper"
        id="paperWrapper"
    >

        <div class="paper">
            <div class="paper-curl"></div>


            <!-- 紙の質感 -->

            <div class="paper-texture"></div>

    <img
        src="contract-text.png"
        class="contract-text-image"
        alt=""
    >

    <div class="paper-curl"></div>
            <!-- 内側の枠 -->

            <div class="paper-border"></div>

        </div>

    </div>

</section>



<!-- =====================================
     JavaScript
===================================== -->

<script>

/* =====================================
   状態管理
===================================== */

let writing = false;
let writingFinished = false;
let signing = false;



/* =====================================
   契約書を表示
===================================== */

setTimeout(() => {

    document
        .getElementById("intro")
        .classList.remove("active");

    document
        .getElementById("contract")
        .classList.add("active");


    /*
     * Contractが出てから
     * 本文を書き始めるまで
     */

    setTimeout(() => {

        startWriting();

    }, 650);

}, 2200);



/* =====================================
   本文を書く
===================================== */

function startWriting() {

    const body =
        document.getElementById(
            "contractBody"
        );


    body.style.visibility =
        "visible";


    writing = true;


    /*
     * 本文を一文字ずつspan化
     */

    function processNode(node) {

        if (
            node.nodeType ===
            Node.TEXT_NODE
        ) {

            const fragment =
                document.createDocumentFragment();


            [
                ...node.textContent
            ].forEach(char => {

                /*
                 * 空白はそのまま
                 */

                if (
                    /\s/.test(char)
                ) {

                    fragment.appendChild(
                        document.createTextNode(
                            char
                        )
                    );

                    return;
                }


                const span =
                    document.createElement(
                        "span"
                    );


                span.className =
                    "char";


                span.textContent =
                    char;


                fragment.appendChild(
                    span
                );

            });


            node.parentNode.replaceChild(
                fragment,
                node
            );

        }

        else if (
            node.nodeType ===
            Node.ELEMENT_NODE
        ) {

            [
                ...node.childNodes
            ].forEach(
                processNode
            );

        }

    }


    [
        ...body.childNodes
    ].forEach(
        processNode
    );


    const chars =
        [
            ...body.querySelectorAll(
                ".char"
            )
        ];


    let index = 0;

    let lastTime = null;

    const speed = 15;


    function writeFrame(time) {


        if (
            lastTime === null
        ) {

            lastTime =
                time;

        }


        const elapsed =
            time - lastTime;


        const count =
            Math.floor(
                elapsed / speed
            );


        if (
            count > 0
        ) {

            for (
                let i = 0;
                i < count &&
                index < chars.length;
                i++
            ) {

                chars[index]
                    .classList
                    .add("written");

                index++;

            }


            lastTime =
                time;
        }


        if (
            index <
            chars.length
        ) {

            requestAnimationFrame(
                writeFrame
            );

        }

        else {

            finishWriting();

        }

    }


    requestAnimationFrame(
        writeFrame
    );



    /*
     * =================================
     * 画面タップによるスキップ用
     * =================================
     */

    document.addEventListener(
        "click",
        handleWritingSkip,
        {
            once: false
        }
    );

}



/* =====================================
   本文表示を完了
===================================== */

function finishWriting() {


    if (
        writingFinished
    ) {

        return;

    }


    writing =
        false;

    writingFinished =
        true;


    /*
     * 残りの文字を全部表示
     */

    document
        .querySelectorAll(
            ".char"
        )
        .forEach(char => {

            char.classList.add(
                "written"
            );

        });


    /*
     * 署名欄を表示
     */

    setTimeout(() => {

        const signature =
            document.getElementById(
                "signature"
            );


        signature.classList.add(
            "ready"
        );


        /*
         * 署名欄へカメラを寄せる
         */

        setTimeout(() => {

            document
                .getElementById(
                    "paperWrapper"
                )
                .classList.add(
                    "signature-focus"
                );

        }, 450);

    }, 250);

}



/* =====================================
   本文表示中のタップ
===================================== */

function handleWritingSkip(event) {


    /*
     * 本文を書いている最中だけ
     */

    if (
        !writing ||
        writingFinished
    ) {

        return;

    }


    /*
     * 署名欄を押した場合は無視
     */

    if (
        event.target.closest(
            "#signature"
        )
    ) {

        return;

    }


    /*
     * 一気に完成状態へ
     */

    finishWriting();

}



/* =====================================
   署名欄
===================================== */

document
    .getElementById(
        "signatureLine"
    )
    .addEventListener(
        "click",
        signContract
    );



/* =====================================
   署名欄をタップ
===================================== */

function signContract() {


    if (
        signing
    ) {

        return;

    }


    signing =
        true;


    const wrapper =
        document.getElementById(
            "paperWrapper"
        );


    /*
     * ズーム解除
     */

    wrapper.classList.remove(
        "signature-focus"
    );


    /*
     * 消滅開始
     */

    wrapper.classList.add(
        "bottom-disappear"
    );


    /*
     * 下から魔法粒子
     */

    createBottomMagic();



    /*
     * =================================
     *
     * ★★★ ここに移動先URLを書く ★★★
     *
     * =================================
     */

    setTimeout(() => {

        window.location.href =
            "ここにURL";

    }, 1900);

}



/* =====================================
   下から舞い上がる魔法
===================================== */

function createBottomMagic() {


    const wrapper =
        document.getElementById(
            "paperWrapper"
        );


    /*
     * 粒子を大量生成
     */

    for (
        let i = 0;
        i < 130;
        i++
    ) {


        const particle =
            document.createElement(
                "span"
            );


        particle.className =
            "bottom-particle";


        /*
         * 紙の下側から発生
         */

        particle.style.left =
            (
                5 +
                Math.random() * 90
            ) + "%";


        particle.style.top =
            (
                88 +
                Math.random() * 24
            ) + "%";


        /*
         * 横方向
         */

        particle.style.setProperty(
            "--x",
            (
                Math.random() * 120 -
                60
            ) + "px"
        );


        /*
         * 上へ飛ぶ
         */

        particle.style.setProperty(
            "--y",
            -(
                40 +
                Math.random() * 180
            ) + "px"
        );


        const size =
            2 +
            Math.random() * 6;


        particle.style.width =
            size + "px";


        particle.style.height =
            size + "px";


        particle.style.animationDelay =
            (
                Math.random() * 0.7
            ) + "s";


        wrapper.appendChild(
            particle
        );


        setTimeout(() => {

            particle.remove();

        }, 1900);

    }

}

</script>

    document
    .querySelector(".contract-text-image")
    .classList.add("show");
</body>
</html>
