<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Contract</title>


    <!-- =================================
         Webフォント
    ================================== -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================
     ① 最初の画面
===================================== -->

<section
    id="intro"
    class="screen active"
>

    <div class="intro-text">
        さあ、契約を。
    </div>

</section>



<!-- =====================================
     ② 契約書
===================================== -->

<section
    id="contract"
    class="screen"
>

    <div
        class="paper-wrapper"
        id="paperWrapper"
    >

        <div class="paper">


            <!-- 紙の端 -->

            <div class="paper-curl"></div>


            <!-- 紙の質感 -->

            <div class="paper-texture"></div>


            <!-- =================================
                 手書き文字画像
                 
                 ここに
                 題名
                 本文
                 署名
                 を入れた透過PNGを置く
            ================================== -->

            <img
                src="contract-text.png"
                class="contract-text-image"
                id="contractTextImage"
                alt=""
            >


            <!-- =================================
                 署名タップ領域

                 見た目は透明。
                 画像の署名部分を押すための領域。
            ================================== -->

            <button
                type="button"
                class="signature-hitarea"
                id="signatureLine"
                aria-label="契約に署名する"
            ></button>


            <!-- 内側の枠 -->

            <div class="paper-border"></div>

        </div>

    </div>

</section>



<!-- =====================================
     JavaScript
===================================== -->

<script>

"use strict";


/* =====================================
   状態管理
===================================== */

let writing = false;
let writingFinished = false;
let signing = false;


/* =====================================
   各要素
===================================== */

const intro =
    document.getElementById("intro");

const contract =
    document.getElementById("contract");

const paperWrapper =
    document.getElementById("paperWrapper");

const contractTextImage =
    document.getElementById("contractTextImage");

const signatureLine =
    document.getElementById("signatureLine");


/* =====================================
   初期状態
===================================== */

contractTextImage.classList.remove("show");


/* =====================================
   ① 最初の画面
   ↓
   ② 契約書表示
===================================== */

setTimeout(() => {

    intro.classList.remove("active");

    contract.classList.add("active");


    /*
     * 契約書が出てきてから
     * 手書き文字を表示
     */

    setTimeout(() => {

        startWriting();

    }, 650);

}, 2200);



/* =====================================
   手書き文字を表示
===================================== */

function startWriting() {

    if (writingFinished) {
        return;
    }


    writing = true;


    /*
     * 手書き文字画像を
     * ふわっと表示
     */

    requestAnimationFrame(() => {

        contractTextImage.classList.add("show");

    });


    /*
     * 少し時間を置いて
     * 完成状態にする
     *
     * ここは文字量に応じて変更可能
     */

    setTimeout(() => {

        finishWriting();

    }, 1800);


    /*
     * 画面タップでスキップ
     */

    document.addEventListener(
        "click",
        handleWritingSkip
    );

}



/* =====================================
   本文表示完了
===================================== */

function finishWriting() {

    if (writingFinished) {
        return;
    }


    writing = false;

    writingFinished = true;


    /*
     * 念のため完全表示
     */

    contractTextImage.classList.add("show");


    /*
     * タップできる状態にする
     */

    setTimeout(() => {

        paperWrapper.classList.add(
            "signature-focus"
        );

        signatureLine.classList.add(
            "ready"
        );

    }, 250);


    /*
     * スキップ用イベント解除
     */

    document.removeEventListener(
        "click",
        handleWritingSkip
    );

}



/* =====================================
   文字表示中のタップ
===================================== */

function handleWritingSkip(event) {

    if (
        !writing ||
        writingFinished
    ) {
        return;
    }


    /*
     * 署名部分を押した場合は無視
     */

    if (
        event.target.closest(
            "#signatureLine"
        )
    ) {
        return;
    }


    /*
     * 一気に表示
     */

    finishWriting();

}



/* =====================================
   署名
===================================== */

signatureLine.addEventListener(
    "click",
    signContract
);



/* =====================================
   契約に署名
===================================== */

function signContract() {

    if (
        signing ||
        !writingFinished
    ) {
        return;
    }


    signing = true;


    /*
     * TAPを消す
     */

    signatureLine.classList.remove(
        "ready"
    );


    /*
     * ズーム解除
     */

    paperWrapper.classList.remove(
        "signature-focus"
    );


    /*
     * 少し間を置いて
     * 消滅開始
     */

    requestAnimationFrame(() => {

        paperWrapper.classList.add(
            "bottom-disappear"
        );

    });


    /*
     * 下から魔法粒子
     */

    createBottomMagic();


    /*
     * =================================
     *
     * 移動先URL
     *
     * =================================
     */

    setTimeout(() => {

        window.location.href =
            "ここにURL";

    }, 1900);

}



/* =====================================
   下から舞い上がる魔法
===================================== */

function createBottomMagic() {

    const wrapper =
        document.getElementById(
            "paperWrapper"
        );


    /*
     * 粒子を大量生成
     */

    for (
        let i = 0;
        i < 130;
        i++
    ) {

        const particle =
            document.createElement(
                "span"
            );


        particle.className =
            "bottom-particle";


        /*
         * 紙の下側から発生
         */

        particle.style.left =
            (
                5 +
                Math.random() * 90
            ) + "%";


        particle.style.top =
            (
                88 +
                Math.random() * 24
            ) + "%";


        /*
         * 横方向
         */

        particle.style.setProperty(
            "--x",
            (
                Math.random() * 120 -
                60
            ) + "px"
        );


        /*
         * 上へ飛ぶ
         */

        particle.style.setProperty(
            "--y",
            -(
                40 +
                Math.random() * 180
            ) + "px"
        );


        const size =
            2 +
            Math.random() * 6;


        particle.style.width =
            size + "px";


        particle.style.height =
            size + "px";


        particle.style.animationDelay =
            (
                Math.random() * 0.7
            ) + "s";


        wrapper.appendChild(
            particle
        );


        setTimeout(() => {

            particle.remove();

        }, 1900);

    }

}

</script>

</body>
</html>
