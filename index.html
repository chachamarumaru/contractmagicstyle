<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no"
    >

    <title>Contract</title>


    <!-- Webフォント -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Italianno&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================
     ① 最初の画面
===================================== -->

<section
    id="intro"
    class="screen active"
>

    <div class="intro-text">
        さあ、契約を。
    </div>

</section>



<!-- =====================================
     ② 契約書
===================================== -->

<section
    id="contract"
    class="screen"
>

    <div
        class="paper-wrapper"
        id="paperWrapper"
    >

        <div class="paper">


            <!-- 紙の質感 -->

            <div class="paper-texture"></div>


            <!-- =================================
                 手書き文字画像

                 1枚の画像を3つ重ねて使用
                 位置・サイズは全部同じ
            ================================== -->

            <div class="contract-writing">

                <!-- 題名 -->
                <div class="writing-part writing-title">

                    <img
                        src="contract-text.png"
                        alt=""
                    >

                </div>


                <!-- 本文 -->
                <div class="writing-part writing-body">

                    <img
                        src="contract-text.png"
                        alt=""
                    >

                </div>


                <!-- 署名 -->
                <div class="writing-part writing-signature">

                    <img
                        src="contract-text.png"
                        alt=""
                    >

                </div>

            </div>



            <!-- =================================
                 署名をタップする場所
            ================================== -->

            <div
                id="signature"
                class="signature"
            >

                <div
                    class="signature-line"
                    id="signatureLine"
                ></div>

            </div>



            <!-- 紙の端 -->

            <div class="paper-curl"></div>


            <!-- 内側の枠 -->

            <div class="paper-border"></div>

        </div>

    </div>

</section>



<!-- =====================================
     JavaScript
===================================== -->

<script>


/* =====================================
   状態管理
===================================== */

let writing = false;

let writingFinished = false;

let signing = false;



/* =====================================
   契約書を表示
===================================== */

setTimeout(() => {

    document
        .getElementById("intro")
        .classList.remove("active");


    document
        .getElementById("contract")
        .classList.add("active");


    /*
     * 紙が出てから
     * 題名を表示
     */

    setTimeout(() => {

        showTitle();

    }, 650);

}, 2200);



/* =====================================
   題名表示
===================================== */

function showTitle() {

    const title =
        document.querySelector(
            ".writing-title"
        );


    title.classList.add("show");


    /*
     * 題名が出たあと
     * 本文を書く
     */

    setTimeout(() => {

        startWriting();

    }, 850);

}



/* =====================================
   本文表示開始
===================================== */

function startWriting() {

    if (writingFinished) {

        return;

    }


    writing = true;


    const body =
        document.querySelector(
            ".writing-body"
        );


    /*
     * 本文をさらさらーっと
     * 下方向へ表示
     */

    body.classList.add("writing");


    /*
     * 本文表示時間
     */

    setTimeout(() => {

        finishWriting();

    }, 2600);


    /*
     * タップでスキップ可能
     */

    document.addEventListener(
        "click",
        handleWritingSkip
    );

}



/* =====================================
   本文表示完了
===================================== */

function finishWriting() {

    if (writingFinished) {

        return;

    }


    writing = false;

    writingFinished = true;


    /*
     * 本文を完全表示
     */

    const body =
        document.querySelector(
            ".writing-body"
        );


    body.classList.add("complete");


    /*
     * 署名を少し遅れて表示
     */

    setTimeout(() => {

        showSignature();

    }, 350);

}



/* =====================================
   署名表示
===================================== */

function showSignature() {

    const signature =
        document.querySelector(
            ".writing-signature"
        );


    signature.classList.add("show");


    /*
     * 署名画像が出てから
     * タップ位置を表示
     */

    setTimeout(() => {

        document
            .getElementById("signature")
            .classList.add("ready");


    }, 450);


    /*
     * カメラを署名部分へ寄せる
     */

    setTimeout(() => {

        document
            .getElementById("paperWrapper")
            .classList.add(
                "signature-focus"
            );

    }, 700);

}



/* =====================================
   本文表示中のタップ
===================================== */

function handleWritingSkip(event) {

    if (
        !writing ||
        writingFinished
    ) {

        return;

    }


    /*
     * 署名欄は無視
     */

    if (
        event.target.closest(
            "#signature"
        )
    ) {

        return;

    }


    finishWriting();

}



/* =====================================
   署名タップ
===================================== */

document
    .getElementById("signatureLine")
    .addEventListener(
        "click",
        signContract
    );



/* =====================================
   契約する
===================================== */

function signContract() {

    if (signing) {

        return;

    }


    signing = true;


    const wrapper =
        document.getElementById(
            "paperWrapper"
        );


    /*
     * ズーム解除
     */

    wrapper.classList.remove(
        "signature-focus"
    );


    /*
     * 紙を下から消す
     */

    wrapper.classList.add(
        "bottom-disappear"
    );


    /*
     * 魔法粒子
     */

    createBottomMagic();



    /*
     * =================================
     * ★★★ 移動先URL ★★★
     * =================================
     */

    setTimeout(() => {

        window.location.href =
            "ここにURL";

    }, 1900);

}



/* =====================================
   下から舞い上がる魔法
===================================== */

function createBottomMagic() {

    const wrapper =
        document.getElementById(
            "paperWrapper"
        );


    for (
        let i = 0;
        i < 130;
        i++
    ) {

        const particle =
            document.createElement(
                "span"
            );


        particle.className =
            "bottom-particle";


        particle.style.left =
            (
                5 +
                Math.random() * 90
            ) + "%";


        particle.style.top =
            (
                88 +
                Math.random() * 24
            ) + "%";


        particle.style.setProperty(
            "--x",
            (
                Math.random() * 120 -
                60
            ) + "px"
        );


        particle.style.setProperty(
            "--y",
            -(
                40 +
                Math.random() * 180
            ) + "px"
        );


        const size =
            2 +
            Math.random() * 6;


        particle.style.width =
            size + "px";


        particle.style.height =
            size + "px";


        particle.style.animationDelay =
            (
                Math.random() * 0.7
            ) + "s";


        wrapper.appendChild(
            particle
        );


        setTimeout(() => {

            particle.remove();

        }, 1900);

    }

}

</script>

</body>
</html>
